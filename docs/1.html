<!DOCTYPE html><html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Обратный отсчёт до Нового года</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0b1d3a, #020617);
      color: white;
    }/* Центрированный блок таймера */
.center {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.timer {
  background: rgba(0,0,0,0.4);
  padding: 32px 40px;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}

.timer h1 {
  margin: 0 0 16px;
  font-size: 2rem;
  letter-spacing: 0.04em;
}

.time {
  font-size: 2.2rem;
  font-weight: 600;
  display: grid;
  grid-template-columns: repeat(4, auto);
  gap: 16px;
}

.time div {
  min-width: 90px;
}

.label {
  display: block;
  font-size: 0.8rem;
  opacity: 0.8;
  margin-top: 4px;
}

/* Дед Мороз сбоку */
.santa {
  position: fixed;
  right: 24px;
  bottom: 24px;
  font-size: 120px;
  z-index: 2;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
  user-select: none;
}

/* Снег */
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  user-select: none;
  pointer-events: none;
  z-index: 1;
  animation-name: fall;
  animation-timing-function: linear;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

  </style>
</head>
<body>
  <div class="center">
    <div class="timer">
      <h1>До Нового года осталось</h1>
      <div class="time">
        <div><span id="days">0</span><span class="label">дней</span></div>
        <div><span id="hours">0</span><span class="label">часов</span></div>
        <div><span id="minutes">0</span><span class="label">минут</span></div>
        <div><span id="seconds">0</span><span class="label">секунд</span></div>
      </div>
    </div>
  </div>  <div class="santa">🎅</div>  <script>
    // Обратный отсчёт до следующего 1 января
    function updateCountdown() {
      const now = new Date();
      const year = now.getMonth() === 11 && now.getDate() > 31 ? now.getFullYear() + 1 : now.getFullYear() + 1;
      const newYear = new Date(January 1, ${year} 00:00:00);
      const diff = newYear - now;

      const totalSeconds = Math.max(0, Math.floor(diff / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Генерация падающего снега
    const snowflakes = ['❄', '❅', '❆'];

    function createSnowflake() {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];

      const size = Math.random() * 18 + 10;
      snowflake.style.fontSize = size + 'px';
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.opacity = Math.random() * 0.6 + 0.4;

      const duration = Math.random() * 5 + 5;
      snowflake.style.animationDuration = duration + 's';

      document.body.appendChild(snowflake);

      setTimeout(() => {
        snowflake.remove();
      }, duration * 1000);
    }

    setInterval(createSnowflake, 150);
  </script></body>
</html>
